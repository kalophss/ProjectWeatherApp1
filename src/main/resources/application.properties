spring.application.name=World Clock & Weather
server.port=8081
# Το κλειδί ΔΕΝ αποθηκεύεται στο repo: ορίστε τη μεταβλητή περιβάλλοντος OWM_API_KEY
openweathermap.api.key=${OWM_API_KEY}
# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
# WebClient timeout
spring.webflux.client.max-in-memory-size=2MB
spring.datasource.url=jdbc:h2:file:./data/worldclockdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
